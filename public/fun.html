<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something Fun</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <div class="account" id="account"></div>
      <a href="/" class="brand">📚 My Bookshelf</a>
      <div class="nav-links">
        <a href="/">My books</a>
        <a href="/add.html">Add new book</a>
        <a href="/stats.html">Statistics</a>
        <a href="/fun.html" aria-current="page">Something fun</a>
      </div>
    </div>
  </nav>

  <main class="container fun">
    <button type="button" class="smiley" id="smiley" aria-label="Smiley — click me">😀</button>
    <p class="fun-message" id="fun-message">Hi! Click me 👆</p>
  </main>

  <script src="common.js"></script>
  <script>
    const faces = ["😀", "😄", "😁", "😆", "😊", "🥳", "😎", "🤩", "😜", "🤓"];
    const messages = [
      "Keep reading! 📖",
      "One more chapter… 😏",
      "You're doing great!",
      "Books are the best ✨",
      "Reading streak: legendary",
      "Bookworm mode: ON 🐛",
      "Have a lovely day!",
    ];
    const smiley = document.getElementById("smiley");
    const message = document.getElementById("fun-message");
    const pick = (list, not) => {
      let item;
      do item = list[Math.floor(Math.random() * list.length)];
      while (item === not && list.length > 1);
      return item;
    };

    smiley.addEventListener("click", () => {
      smiley.textContent = pick(faces, smiley.textContent);
      message.textContent = pick(messages, message.textContent);
      smiley.classList.remove("spin");
      void smiley.offsetWidth; // restart the animation
      smiley.classList.add("spin");
    });
  </script>
</body>
</html>
