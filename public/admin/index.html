<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <div class="account" id="account"></div>
      <a href="/" class="brand">📚 My Bookshelf</a>
      <div class="nav-links">
        <a href="/">My books</a>
        <a href="/add/">Add new book</a>
        <a href="/stats/">Statistics</a>
        <a href="/fun/">Something fun</a>
      </div>
    </div>
  </nav>

  <main class="container wide">
    <header>
      <h1>🛡️ Admin</h1>
      <p class="subtitle">Manage the accounts on your bookshelf</p>
    </header>

    <p class="error" id="error" hidden></p>
    <p class="notice" id="notice" hidden></p>

    <section class="card admin-card">
      <table class="user-table">
        <thead>
          <tr>
            <th scope="col">Username</th>
            <th scope="col">Role</th>
            <th scope="col">Books</th>
            <th scope="col">Joined</th>
            <th scope="col"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody id="user-rows"></tbody>
      </table>
    </section>
  </main>

  <template id="user-row">
    <tr>
      <td>
        <input type="text" class="username-input" aria-label="Username">
        <span class="you-badge" hidden>you</span>
      </td>
      <td>
        <select class="role-select" aria-label="Role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </td>
      <td class="book-count"></td>
      <td class="joined"></td>
      <td class="row-actions">
        <button type="button" class="primary small save">Save</button>
        <button type="button" class="ghost small reset">New password</button>
        <button type="button" class="ghost small danger delete">Delete</button>
        <div class="reset-form" hidden>
          <input type="password" class="new-password" placeholder="New password" autocomplete="new-password" aria-label="New password">
          <button type="button" class="primary small set-password">Set</button>
          <button type="button" class="ghost small cancel-reset">Cancel</button>
        </div>
      </td>
    </tr>
  </template>

  <script src="/shared/common.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
